spring:
  application:
    name: server
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}

jwt:
  secret: ${JWT_SECRET}
  access-expiration-seconds: 3600
  refresh-expiration-seconds: 1209600
