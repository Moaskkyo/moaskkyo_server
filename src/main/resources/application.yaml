spring:
  application:
    name: server
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}
  jackson:
    mapper:
      # 요청 본문의 "true"(문자열), 1(숫자)을 Boolean 등으로 바꿔 받지 않고 400으로 거절한다.
      allow-coercion-of-scalars: false

jwt:
  secret: ${JWT_SECRET}
  access-expiration-seconds: 3600
  refresh-expiration-seconds: 1209600

neis:
  api-key: ${NEIS_API_KEY:}

holiday:
  service-key: ${HOLIDAY_SERVICE_KEY:}
